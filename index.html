<style>

.mini{font-size:12px;color:var(--mut)}
</style></head><body>

<script>
var API='https://script.google.com/macros/s/AKfycbzybhVv_yDZts3JBqxWEEpIe57m4XSezeRVDhcrLsEUK5qYenQjonuKTqTei8itU8bi/exec';
var K=(function(){var h=((location.hash||'')+'&'+(location.search||'')).match(/k=([0-9a-f]{20,})/i),k=h?h[1].toLowerCase():'';
 try{if(k)localStorage.setItem('pm_k',k);else k=localStorage.getItem('pm_k')||'';}catch(e){}
 return k;})();
function pedirChave(msg){$('app').innerHTML='<div class="card" style="max-width:420px;margin:40px auto"><h3 style="font-size:16px">Acesso ao painel</h3><div class="note" style="margin-bottom:10px">'+(msg||'Cole aqui o código de acesso (ou o link completo) que veio por e-mail. Só é preciso fazer isso uma vez neste aparelho.')+'</div><input type="text" id="kIn" placeholder="Código ou link de acesso" autocomplete="off" autocapitalize="off" style="width:100%"><button class="btn" style="width:100%;margin-top:10px" onclick="usarChave()">Entrar</button></div>'}
function usarChave(){var v=($('kIn').value||'').match(/([0-9a-f]{40,})/i);if(!v){snack('Código inválido — confira se colou inteiro');return}K=v[1].toLowerCase();try{localStorage.setItem('pm_k',K)}catch(e){}carregar()}
var D=null,M=[],CIC=[],S={lente:'caixa',per:'',banco:'',tab:'inicio',cat:null,sub:null,busca:'',fx:'tudo'},CH={},COR={};
var MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var NAT={DESPESA:'Gasto',RECEITA:'Receita',ESTORNO:'Estorno / devolução',INVESTIMENTO_APLICACAO:'Investimento (aplicação)',INVESTIMENTO_RESGATE:'Resgate de investimento',TRANSFERENCIA_INTERNA:'Entre minhas contas',TRANSFERENCIA_PROPRIA_EXTERNA:'Para conta minha não conectada',PAGAMENTO_FATURA:'Pagamento de fatura',PAGAMENTO_FATURA_CARTAO:'Pagamento recebido no cartão',AJUSTE_CARTAO:'Ajuste de cartão',IGNORADA:'Ignorar (não contar)'};
var NAT_RAPIDA=['DESPESA','RECEITA','INVESTIMENTO_APLICACAO','INVESTIMENTO_RESGATE','TRANSFERENCIA_INTERNA','ESTORNO','IGNORADA'];
var SEM_CAIXA={INVESTIMENTO_APLICACAO:1,INVESTIMENTO_RESGATE:1,TRANSFERENCIA_INTERNA:1};
// paleta categórica validada (ordem fixa) — claro / escuro
var DARK=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
var PAL=DARK?['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767']:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'];
var OUTRAS='#898781';
function $(id){return document.getElementById(id)}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function jsq(s){return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"))}
function brl(v,c){var a=Math.abs(v||0);return (v<0?'− ':'')+'R$ '+a.toLocaleString('pt-BR',{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0})}
function brlk(v){var a=Math.abs(v);return a>=1000?(a/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':String(Math.round(a))}
function pct(v){return v==null||!isFinite(v)?'—':(v*100).toFixed(0)+'%'}
function soma(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}
function agrupa(rows,k){var o={};rows.forEach(function(x){var c=typeof k==='function'?k(x):x[k];o[c]=(o[c]||0)+x.v});return Object.keys(o).map(function(c){return[c,o[c]]})}
// datas
function dt(s){return new Date(s+'T12:00:00Z')}
function ds(d){return d.toISOString().slice(0,10)}
function addD(s,n){var d=dt(s);d.setUTCDate(d.getUTCDate()+n);return ds(d)}
function difD(a,b){return Math.round((dt(b)-dt(a))/864e5)}
function addM(m,n){var y=+m.slice(0,4),k=+m.slice(5,7)-1+n;y+=Math.floor(k/12);k=((k%12)+12)%12;return y+'-'+(k<9?'0':'')+(k+1)}
function fd(s){return s.slice(8,10)+'/'+MES[+s.slice(5,7)-1]}
function fdd(s){return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4)}
// normalização e assinatura (igual ao servidor)
var GEN=('PIX ENVIADO RECEBIDO TRANSF TRANSFERENCIA TED DOC PAG PAGTO PAGAMENTO PAGTO COMPRA COMPRAS DEBITO CREDITO BOLETO CARTAO CART PARC PARCELA LTDA EIRELI EPP SAO PAULO BRA BRASIL COM WWW HTTP SERVICOS SERV DEB AUT AUTOMATICO VISA MASTER ELO INT NACIONAL APLICACAO QRS QRCODE CONTA CORRENTE').split(' ');
var GATE=['ASAAS','PAGSEGURO','MERCADO PAGO','MERCADOPAGO','STONE','CIELO','GETNET','INFINITEPAY','SUMUP','PAGARME','IUGU','REDE'];
function nrm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim()}
function limpa(s){return nrm(s).replace(/[^A-Z ]/g,' ').split(' ').filter(function(t){return t.length>=2&&GEN.indexOf(t)<0})}
function assin(x){var d=String(x.doc||'').replace(/\D/g,''),cp=nrm(x.cp),g=GATE.some(function(k){return cp.indexOf(k)>=0});
 if(d.length>=11&&!g)return 'DOC:'+d;var t=limpa(x.cp);if(g||!t.length)t=limpa(x.desc).concat(g?t:[]);
 if(!t.length)return 'TXT:'+nrm(x.desc).replace(/\d/g,'').replace(/\s+/g,' ').trim().slice(0,30);return 'TXT:'+t.slice(0,4).join(' ')}
function protegido(x){return {IGNORADA:1,PAGAMENTO_FATURA:1,PAGAMENTO_FATURA_CARTAO:1,AJUSTE_CARTAO:1}[x.nat]||(x.nat==='TRANSFERENCIA_INTERNA'&&x.par)}
function semelhantes(x){var a=assin(x),dir=x.v>0;return M.filter(function(y){return y.id!==x.id&&y.org!=='MANUAL'&&!protegido(y)&&(y.v>0)===dir&&assin(y)===a})}
// comunicação
function call(fn,arg,ok,fail){
 if(!K){pedirChave();return}
 fetch(API,{method:'POST',credentials:'omit',redirect:'follow',body:JSON.stringify({k:K,fn:fn,arg:arg})})
 .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
 .then(function(j){if(!j.ok){if(/autorizado/i.test(j.erro||'')){try{localStorage.removeItem('pm_k')}catch(e){}K='';pedirChave('Código de acesso inválido ou trocado. Cole o código/link mais recente que veio por e-mail.');return}throw new Error(j.erro)}ok&&ok(j.r)})
 .catch(function(e){snack('Erro: '+(e.message||e));fail&&fail(e)});
}
var _sn;function snack(t,acao,ms){$('snackT').textContent=t;var b=$('snackB');b.style.display=acao?'':'none';b.onclick=function(){$('snack').className='snack';acao&&acao()};$('snack').className='snack on';clearTimeout(_sn);_sn=setTimeout(function(){$('snack').className='snack'},ms||(acao?9000:2600))}
function carregar(){$('app').innerHTML='<div class="loading">Carregando seus dados…</div>';call('dadosPainel',undefined,function(t){aplicar(t)})}
function aplicar(t){D=JSON.parse(t);prep();montarPeriodos();render()}
function prep(){M=D.mov.map(function(a){return{id:String(a[0]),data:String(a[1]||''),mc:a[2],mo:a[3],banco:a[4],ct:a[5],cn:a[6],desc:a[7],cp:a[8],v:a[9],nat:a[10],ec:a[11],eo:a[12],cat:a[13]||'',sub:a[14]||'',tr:a[15]||'',rev:a[16],mot:a[17]||'',parc:a[18],st:a[19],doc:a[20],org:a[21]||'',par:a[22]||''}});
 var s=D.sync.fim?('Atualizado em '+D.sync.fim.slice(8,10)+'/'+D.sync.fim.slice(5,7)+' às '+D.sync.fim.slice(11,16)):'';$('sync').textContent=s+(D.sync.status&&D.sync.status!=='OK'?' · '+D.sync.status:'');
 var n=M.filter(function(x){return x.rev}).length+D.pag.filter(function(r){return !r[9]}).length;$('bdg').textContent=n?n:'';$('bdg').style.display=n?'':'none';
 // cor fixa por categoria (ordem de gasto total), "Outras" em cinza
 var g=agrupa(M.filter(function(x){return x.nat==='DESPESA'}),'cat').sort(function(a,b){return a[1]-b[1]});COR={};g.forEach(function(k,i){COR[k[0]]=i<PAL.length?PAL[i]:OUTRAS});
 CIC=ciclos()}
function cor(c){return COR[c]||OUTRAS}
// ciclos: começam no dia do pagamento dos plantões (maior entrada entre os dias 15 e 28; padrão dia 20)
function ciclos(){var rec=M.filter(function(x){return x.nat==='RECEITA'&&x.ec&&x.v>0&&x.tr!=='Rendimentos financeiros'}),an={};
 rec.forEach(function(x){var m=x.data.slice(0,7),d=+x.data.slice(8,10);if(d<15||d>28)return;if(!an[m]||x.v>an[m].v)an[m]=x});
 // a âncora precisa ter porte de pagamento de plantões (>= 40% da mediana das âncoras); senão o ciclo começa no dia 20 previsto
 var vs=Object.keys(an).map(function(k){return an[k].v}).sort(function(a,b){return a-b}),med=vs.length?vs[Math.floor(vs.length/2)]:0;
 Object.keys(an).forEach(function(k){if(an[k].v<med*0.4)delete an[k]});
 var ini=D.mov.length?M.reduce(function(a,x){return x.data&&x.data<a?x.data:a},D.hoje).slice(0,7):D.hojeMes,ms=[],m=addM(ini,-1);
 while(m<=addM(D.hojeMes,1)){ms.push(m);m=addM(m,1)}
 var st=ms.map(function(m){var a=an[m];return{ini:a?a.data:m+'-20',det:!!a,val:a?a.v:0,cp:a?a.cp:''}});
 var out=[];for(var i=0;i<st.length-1;i++){var c=st[i];c.fim=addD(st[i+1].ini,-1);c.prox=st[i+1];if(c.ini<=D.hoje)out.push(c)}
